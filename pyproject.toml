[project]
name = "rag-fastapi-demo"
version = "0.1.0"
description = "Public REST API demo for retrieval-augmented generation — chunk, embed, store in Qdrant, query. Built on FastAPI + sentence-transformers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Denis Ryzhkov", email = "denis.ryzhkov18@gmail.com" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2",
  "python-multipart>=0.0.20",
  "qdrant-client>=1.12",
  "sentence-transformers>=3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.8",
]
openai = [
  "openai>=1.50",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
